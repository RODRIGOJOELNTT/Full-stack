server:
  port: 8095

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # Example routes to local microservices. Change ports/hosts to match your environment.
      routes:
        - id: customers-service
          uri: http://localhost:8080
          predicates:
            - Path=/customers/**
        - id: payments-service
          uri: http://localhost:8081
          predicates:
            - Path=/payments/**

      # CORS allowlist (adjust for your frontend).
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:4200"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: when_authorized
